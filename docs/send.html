<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar mensaje a Juan 💕</title>
  <!-- API base URL - configurar en Render -->
  <meta name="api-base" content="https://mensajitos-api.onrender.com">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f0f23 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #fff;
    }
    .container {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    h1 {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      background: linear-gradient(135deg, #ff6b9d, #ffcc70);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }
    .subtitle {
      text-align: center;
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-bottom: 32px;
    }
    .form-group { margin-bottom: 20px; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
    }
    input, textarea {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.05);
      color: #fff;
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #ff6b9d;
      box-shadow: 0 0 0 3px rgba(255, 107, 157, 0.2);
    }
    input::placeholder, textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    .file-input { position: relative; }
    .file-input input[type="file"] {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px 16px;
      border: 2px dashed rgba(255, 107, 157, 0.4);
      border-radius: 12px;
      background: rgba(255, 107, 157, 0.05);
      color: #ff6b9d;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .file-label:hover {
      border-color: #ff6b9d;
      background: rgba(255, 107, 157, 0.1);
    }
    .file-label.has-file {
      border-style: solid;
      border-color: #4ade80;
      background: rgba(74, 222, 128, 0.1);
      color: #4ade80;
    }
    .preview {
      display: none;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      max-height: 200px;
    }
    .preview img, .preview video {
      width: 100%;
      height: auto;
      display: block;
    }
    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #ff6b9d, #c44569);
      color: white;
      box-shadow: 0 4px 20px rgba(255, 107, 157, 0.4);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(255, 107, 157, 0.5);
    }
    .btn-primary:active { transform: translateY(0); }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .status {
      text-align: center;
      font-size: 13px;
      margin-top: 16px;
      min-height: 20px;
    }
    .status.sent { color: #4ade80; }
    .status.error { color: #f87171; }
    .status.waiting { color: #fbbf24; }
    .heart {
      display: inline-block;
      animation: beat 1s ease-in-out infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    .quick-actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }
    .quick-btn {
      padding: 14px;
      border: 1px solid rgba(255, 107, 157, 0.3);
      background: rgba(255, 107, 157, 0.1);
      color: #ff6b9d;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .quick-btn:hover {
      background: rgba(255, 107, 157, 0.2);
      border-color: #ff6b9d;
    }
    .device-id {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px;
      font-family: monospace;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.5);
      text-align: center;
      margin-bottom: 20px;
      user-select: all;
    }
    /* Banner servidor apagado */
    .server-banner {
      display: none;
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.4);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      text-align: center;
    }
    .server-banner.visible { display: block; animation: slideDown 0.3s ease; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .server-banner.waking { background: rgba(251, 191, 36, 0.15); border-color: rgba(251, 191, 36, 0.4); }
    .server-banner h3 { color: #f87171; margin-bottom: 8px; font-size: 15px; }
    .server-banner.waking h3 { color: #fbbf24; }
    .server-banner p { color: rgba(255,255,255,0.8); font-size: 13px; margin-bottom: 12px; }
    .server-banner .btn { width: auto; min-width: 160px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Mensajes para Juan 💕</h1>
    <p class="subtitle">Escribe algo bonito, envía una foto o un GIF</p>

    <!-- Banner: servidor apagado / despertando -->
    <div class="server-banner" id="serverBanner">
      <h3 id="bannerTitle">Servidor apagado</h3>
      <p id="bannerMsg">El servidor está dormido. Espera un momento…</p>
      <button class="btn btn-primary" id="wakeBtn" style="display:none;">Despertar servidor</button>
    </div>

    <div class="device-id" id="deviceId">ID fijo: juan-macbook</div>

    <div class="quick-actions">
      <button class="quick-btn" data-text="Te extraño mucho 💕">Te extraño</button>
      <button class="quick-btn" data-text="Pensando en ti 💭">Pensando en ti</button>
      <button class="quick-btn" data-text="¡Te amo! ❤️">Te amo</button>
      <button class="quick-btn" data-text="Volverte a ver pronto 🏃‍♀️💨">Pronto nos vemos</button>
    </div>

    <form id="msgForm">
      <div class="form-group">
        <label>Mensaje</label>
        <textarea id="textInput" rows="3" placeholder="Escribe tu mensaje..."></textarea>
      </div>

      <div class="form-group">
        <label>Foto o GIF</label>
        <div class="file-input">
          <div class="file-label" id="fileLabel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
            <span id="fileLabelText">Toca para seleccionar</span>
          </div>
          <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">
        </div>
        <div class="preview" id="preview"></div>
      </div>

      <button type="submit" class="btn btn-primary" id="sendBtn">
        <span class="heart">♥</span> Enviar ahora
      </button>

      <div class="status" id="status"></div>
    </form>
  </div>

  <script src="send.js"></script>
</body>
</html>
